---
{{- if .Values.ingress.webui.enabled }}
{{- if not .Values.ingress.webui.host }}
{{- fail "ingress.webui.host is required when ingress.webui.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lidarr.fullname" . }}-webui-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidarr.labels" . | nindent 4 }}
  {{- if .Values.ingress.webui.annotations }}
  annotations:
    {{- range $key, $value := .Values.ingress.webui.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.webui.ingressClassName }}
  ingressClassName: {{ .Values.ingress.webui.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.webui.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lidarr.fullname" . }}-svc
                port:
                  name: webui
  {{- if .Values.ingress.webui.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.webui.host }}
      secretName: {{ .Values.ingress.webui.host }}-tls
  {{- end }}
{{- end }}