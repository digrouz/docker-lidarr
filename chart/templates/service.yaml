---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lidarr.fullname" . }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidarr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8686
      targetPort: webui
      name: webui
      protocol: TCP
  selector:
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: {{ .Release.Name }}
