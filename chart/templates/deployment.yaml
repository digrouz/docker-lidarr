---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lidarr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lidarr.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lidarr
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.container.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8686
              name: webui
          livenessProbe:
            httpGet:
              path: /healthz
              port: webui
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.container.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /config
              name: lidarr-config
            - mountPath: /downloads
              name: lidarr-downloads
            - mountPath: /music
              name: lidarr-music
            {{- if .Values.persistence.extraVolumeMounts }}
            {{- toYaml .Values.persistence.extraVolumeMounts | nindent 12 }}
            {{- end }}
          env:
            - name: GID
              value: "{{ .Values.container.gid }}"
            - name: UID
              value: "{{ .Values.container.uid }}"
            - name: TZ
              value: "{{ .Values.container.tz }}"
            - name: AUTOUPGRADE
              value: "{{ .Values.container.autoupgrade }}"
      volumes:
        - name: lidarr-config
          {{- if eq .Values.persistence.config.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "lidarr.pvc.config" . }}
          {{- else if eq .Values.persistence.config.type "nfs" }}
          nfs:
            server: {{ .Values.persistence.config.nfs.server }}
            path: {{ .Values.persistence.config.nfs.path }}
          {{- else }}
          emptyDir: { }
          {{- end }}
        - name: lidarr-downloads
          {{- if eq .Values.persistence.downloads.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "lidarr.pvc.downloads" . }}
          {{- else if eq .Values.persistence.downloads.type "nfs" }}
          nfs:
            server: {{ .Values.persistence.downloads.nfs.server }}
            path: {{ .Values.persistence.downloads.nfs.path }}
          {{- else }}
          emptyDir: { }
          {{- end }}
        - name: lidarr-music
          {{- if eq .Values.persistence.music.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "lidarr.pvc.music" . }}
          {{- else if eq .Values.persistence.music.type "nfs" }}
          nfs:
            server: {{ .Values.persistence.music.nfs.server }}
            path: {{ .Values.persistence.music.nfs.path }}
          {{- else }}
          emptyDir: { }
          {{- end }}
        {{- if .Values.persistence.extraVolumes }}
        {{- toYaml .Values.persistence.extraVolumes | nindent 8 }}
        {{- end }}